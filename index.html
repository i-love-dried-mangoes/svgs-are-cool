<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section class="section">
        <h1>svgs are cool.</h1>
        <p>here are three circles</p>

        <div class="circlesss">

            <div class="circle-item" id="circle1">
                <p>hover over this one to turn it blue</p>
                <svg width="100" height="100">
                    <circle r="30" cx="50" cy="50" />
                </svg>
            </div>

            <div class="circle-item" id="circle2">
                <p>hover over this one to make it bounce</p>
                <svg width="100" height="100">
                    <circle r="30" cx="50" cy="50" />
                </svg>
            </div>

            <div class="circle-item" id="circle3">
                <p>hover over this one to expand it</p>
                <svg width="100" height="100">
                    <circle r="30" cx="50" cy="50" />
                </svg>
            </div>

        </div>

        <br>
        <br>
        

        <a href="#section-two" class="scroll-link">keep scrolling ↓</a>
    </section>

    <section class="section" id="section-two">
        <h1>no seriously. svgs are <em>cool</em>.</h1>
        <br>
        <svg width="164" height="62" viewBox="0 0 164 62" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="rectangles">
                <rect x="0" y="0" width="19" height="24" fill="#D9D9D9"/>
                <rect x="34" y="24" width="16" height="20" fill="#D9D9D9"/>
                <rect x="9" y="34" width="10" height="28" fill="#D9D9D9"/>
            </g>
            <g id="round">
                <ellipse cx="109" cy="6" rx="14" ry="6" fill="#D9D9D9"/>
                <ellipse cx="121.5" cy="48" rx="12.5" ry="14" fill="#D9D9D9"/>
                <ellipse cx="149" cy="20.5" rx="15" ry="8.5" fill="#D9D9D9"/>
            </g>
        </svg>


    </section>

</body>
</html>
